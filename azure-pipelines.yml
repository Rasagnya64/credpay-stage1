# Starter pipeline
# Start with a minimal pipeline that you can customize to build and deploy your code.
# Add steps that build, run tests, deploy, and more:
# https://aka.ms/yaml

pool:
  vmImage: ubuntu-latest

variables:
  acrserviceconnection: "ACR-SC"
  frontendrepository: 'credpay/frontend-service'
  userrepository: 'credpay/user-service'
  paymentrepository: 'credpay/payment-service'
  tag: '$(Build.BuildId)'

stages:
  - stage: dockerbuild
    displayName: Docker Build
    jobs:
      - job: buildpushimages
        steps: 
          - checkout: self
          - task: Docker@2
            inputs:
              containerRegistry: 'ACR-SC'
              repository: '$(frontendrepository)'
              command: 'buildAndPush'
              Dockerfile: 'frontend-react/dockerfile'
              buildContext: 'frontend-react'
              tags: |
                $(tag)
                latest
          - task: Docker@2
            inputs:
              containerRegistry: 'ACR-SC'
              repository: '$(userrepository)'
              command: 'buildAndPush'
              Dockerfile: 'user-service/dockerfile'
              buildContext: 'user-service'
              tags: |
                $(tag)
                latest
          - task: Docker@2
            inputs:
              containerRegistry: 'ACR-SC'
              repository: '$(paymentrepository)'
              command: 'buildAndPush'
              Dockerfile: 'payment-service/dockerfile'
              buildContext: 'payment-service'
              tags: |
                $(tag)
                latest
