pool:
  vmImage: ubuntu-latest

variables:
  acrserviceconnection: "ACR-SC"
  frontendrepository: 'credpay/frontend-service'
  userrepository: 'credpay/user-service'
  paymentrepository: 'credpay/payment-service'
  tag: '$(Build.BuildId)'

stages:
    - stage: Terraform
      displayName: terraform infra
      jobs:
        - job: terraformapply
          displayName: terraform init and apply
          steps:
            - checkout: self
            - task: TerraformInstaller@1
              inputs:
                terraformVersion: 'latest'

            - task: TerraformTask@5
              inputs:
                provider: 'azurerm'
                command: 'init'
                workingDirectory: 'terraform'
                backendAzureRmUseEntraIdForAuthentication: false
                backendServiceArm: 'Swiggy-Manual'
                backendAzureRmOverrideSubscriptionID: '7cdba76d-54d7-4b66-844d-c9fdf4a98eef'
                backendAzureRmResourceGroupName: 'StorageAccRG'
                backendAzureRmStorageAccountName: 'credpayprojectsa1'
                backendAzureRmContainerName: 'statefile'
                backendAzureRmKey: 'credpay.terraform.tfstate'
